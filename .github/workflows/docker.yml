name: Publish Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Images with cuda/cpu targets (whisper, tts)
  build-multi-target:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: whisper
            dockerfile: docker/whisper.Dockerfile
            target: cuda
            suffix: cuda
          - image: whisper
            dockerfile: docker/whisper.Dockerfile
            target: cpu
            suffix: cpu
          - image: tts
            dockerfile: docker/tts.Dockerfile
            target: cuda
            suffix: cuda
          - image: tts
            dockerfile: docker/tts.Dockerfile
            target: cpu
            suffix: cpu

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          df -h

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Full history for version detection

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to Container Registry
        uses: docker/login-action@v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from trigger
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            # Extract version from release tag (v0.61.3 -> 0.61.3)
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},suffix=-${{ matrix.suffix }},enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=latest,suffix=-${{ matrix.suffix }}
            type=sha,suffix=-${{ matrix.suffix }}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Single-target images (proxies and diarization)
  build-single-target:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: transcribe-proxy
            dockerfile: docker/transcribe-proxy.Dockerfile
          - image: rag-proxy
            dockerfile: docker/rag-proxy.Dockerfile
          - image: memory-proxy
            dockerfile: docker/memory-proxy.Dockerfile
          - image: diarization
            dockerfile: docker/diarization.Dockerfile

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          df -h

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Full history for version detection

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to Container Registry
        uses: docker/login-action@v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from trigger
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            # Extract version from release tag (v0.61.3 -> 0.61.3)
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-diarization:
    needs: build-single-target
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          df -h

      - name: Log in to Container Registry
        uses: docker/login-action@v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image reference
        id: image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            tag="${RELEASE_TAG#v}"
          else
            tag="latest"
          fi
          echo "ref=${REGISTRY}/${GITHUB_REPOSITORY}-diarization:${tag}" >> "$GITHUB_OUTPUT"

      - name: Pull published image
        run: docker pull "${{ steps.image.outputs.ref }}"

      - name: Verify package version
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          actual_version=$(
            docker run --rm --entrypoint /app/.venv/bin/python "$IMAGE_REF" \
              -c 'import importlib.metadata; print(importlib.metadata.version("agent-cli"))'
          )
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            expected_version="${RELEASE_TAG#v}"
            if [[ "${actual_version%%+*}" != "$expected_version" ]]; then
              echo "Expected agent-cli $expected_version, got $actual_version" >&2
              exit 1
            fi
          fi
          echo "Verified agent-cli $actual_version"

      - name: Verify health and API routes
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          container_id=$(docker run --detach --publish 61337:61337 "$IMAGE_REF")
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT

          ready=false
          for _ in {1..30}; do
            if curl --fail --silent http://localhost:61337/health >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            docker logs "$container_id"
            exit 1
          fi

          curl --fail --silent http://localhost:61337/openapi.json > openapi.json
          for route in /health /transcribe /diarize; do
            jq --exit-status --arg route "$route" '.paths[$route]' openapi.json >/dev/null
          done
